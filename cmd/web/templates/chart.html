<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>chart · trading-web</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Trading</div>
  <nav class="topnav">
    <a href="/">Dashboard</a>
    <a href="/journal">Portfolio</a>
    <a href="/validate">Validate</a>
    <a href="/chart" class="active">Chart</a>
    <a href="/onchain">On-chain</a>
    <a href="/ops">Ops</a>
  </nav>
</header>

<main class="chart-main">

  <div class="chart-toolbar">
    <div class="chart-sym-group">
      <select id="chart-symbol" class="chart-select">
        {{$cs := .Symbol}}
        {{range .Symbols}}<option value="{{.}}" {{if eq . $cs}}selected{{end}}>{{.}}</option>{{end}}
      </select>
      <div class="chart-tf-pills" role="radiogroup" aria-label="timeframe">
        {{$ct := .TF}}
        {{range .TFs}}
          <button type="button" class="tf-pill{{if eq . $ct}} active{{end}}" data-tf="{{.}}">{{.}}</button>
        {{end}}
      </div>
    </div>

    <div class="chart-summary" id="chart-summary">
      <span class="side-badge side-flat" id="chart-side">—</span>
      <span class="score score-mr" id="chart-mr">MR —</span>
      <span class="score score-mom" id="chart-mom">MOM —</span>
      <span class="score" id="chart-total">total —</span>
      <span class="diag-score-axis" id="chart-ratio">— /10</span>
      <span class="chart-verdict" id="chart-verdict">—</span>
    </div>

    <button type="button" class="ai-analyze-btn" id="chart-ai-btn"
            data-symbol="{{.Symbol}}" data-tf="{{.TF}}">AI analyze ▸</button>
  </div>

  <div class="chart-one-liner" id="chart-oneliner">Loading…</div>

  <div class="chart-wrap">
    <div id="chart-container" class="chart-canvas"></div>
    <svg id="chart-vp-overlay" class="chart-vp-overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>

  <div class="chart-legend-row" id="chart-legend">
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#4c6ef5"></span>BOLL upper</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#adb5bd"></span>BOLL mid</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#4c6ef5"></span>BOLL lower</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#f59f00"></span>entry</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#e03131"></span>stop</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#2f9e44"></span>TP1</span>
    <span class="chart-legend-item"><span class="chart-legend-sw" style="background:#0ca678"></span>TP2</span>
  </div>

  <div id="chart-ai-result" class="ai-result hidden" data-result-for="chart"></div>

</main>

<footer>
  <span>on-demand refresh · <button type="button" id="chart-refresh" class="chart-refresh-btn">refresh</button></span>
</footer>

<script src="/static/copy.js"></script>
<script src="/static/ai-render.js"></script>
<script src="/static/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
    var symSel = document.getElementById('chart-symbol');
    var tfPills = document.querySelectorAll('.chart-tf-pills .tf-pill');
    var container = document.getElementById('chart-container');
    var sideEl   = document.getElementById('chart-side');
    var mrEl     = document.getElementById('chart-mr');
    var momEl    = document.getElementById('chart-mom');
    var totalEl  = document.getElementById('chart-total');
    var ratioEl  = document.getElementById('chart-ratio');
    var verdEl   = document.getElementById('chart-verdict');
    var linerEl  = document.getElementById('chart-oneliner');
    var aiBtn    = document.getElementById('chart-ai-btn');
    var aiPane   = document.getElementById('chart-ai-result');
    var refreshBtn = document.getElementById('chart-refresh');

    // ── Chart construction ──────────────────────────────────────────
    var chart = LightweightCharts.createChart(container, {
        layout: {
            background: { type: 'solid', color: '#0d1117' },
            textColor:  '#c9d1d9',
        },
        grid: {
            vertLines: { color: 'rgba(255,255,255,0.04)' },
            horzLines: { color: 'rgba(255,255,255,0.04)' },
        },
        rightPriceScale: { borderColor: 'rgba(255,255,255,0.10)' },
        timeScale:       { borderColor: 'rgba(255,255,255,0.10)', timeVisible: true, secondsVisible: false },
        crosshair:       { mode: 1 /* magnet */ },
        autoSize: true,
    });

    var candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a',   wickDownColor: '#ef5350',
    });
    var upperSeries = chart.addLineSeries({ color: '#4c6ef5', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    var midSeries   = chart.addLineSeries({ color: '#adb5bd', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    var lowerSeries = chart.addLineSeries({ color: '#4c6ef5', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });

    var volSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: '',
        color: 'rgba(180,180,180,0.4)',
    });
    // Volume sub-pane at bottom 25% of chart area.
    chart.priceScale('').applyOptions({ scaleMargins: { top: 0.80, bottom: 0 } });

    // ── Lazy history load ──────────────────────────────────────────
    // Track the earliest loaded bar so we can fetch older data when
    // the user pans left. `earliestTime` is unix seconds of the leftmost
    // bar currently on chart. `loading` gates concurrent requests.
    // `allCandles` / `allUpper` / `allMid` / `allLower` are our
    // authoritative copies (LWC series setData wipes anything not passed).
    var earliestTime = null;
    var loadingHistory = false;
    var noMoreHistory = false;
    var allCandles = [];
    var allUpper = [];
    var allMid = [];
    var allLower = [];
    var allVol = [];
    var currentVP = null; // last-received volumeProfile buckets

    // Track plan price lines so we can clear them when data reloads.
    var planLines = [];
    function clearPlanLines() {
        planLines.forEach(function (l) { candleSeries.removePriceLine(l); });
        planLines = [];
    }
    function addPlanLine(price, color, title) {
        if (!price) return;
        planLines.push(candleSeries.createPriceLine({
            price: price, color: color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: title,
        }));
    }

    // ── State + fetch ──────────────────────────────────────────────
    function currentSym() { return symSel.value; }
    function currentTF()  {
        var active = document.querySelector('.chart-tf-pills .tf-pill.active');
        return active ? active.dataset.tf : '1h';
    }

    function scoreClass(total) {
        if (!total || total <= 0) return '';
        if (total >= 5) return 'score-good';
        if (total >= 3) return 'score-borderline';
        return 'score-weak';
    }
    function sideClass(side) {
        if (side === 'LONG')  return 'side-long';
        if (side === 'SHORT') return 'side-short';
        return 'side-flat';
    }

    function applyHeader(data) {
        var sig = data.signal || {};
        var diag = data.diagnose || {};
        sideEl.className = 'side-badge ' + sideClass(sig.side);
        sideEl.textContent = sig.side || '—';
        mrEl.textContent    = 'MR ' + (sig.mrScore   != null ? sig.mrScore   : '—');
        momEl.textContent   = 'MOM ' + (sig.momScore != null ? sig.momScore  : '—');
        totalEl.textContent = 'total ' + (sig.score  != null ? sig.score     : '—');
        totalEl.className   = 'score ' + scoreClass(sig.score);
        if (diag.total != null) {
            ratioEl.textContent = diag.total.toFixed(1) + '/10';
            verdEl.textContent  = diag.verdict || '';
        } else {
            ratioEl.textContent = '—/10';
            verdEl.textContent  = '';
        }
        linerEl.textContent = data.summary || '';
        aiBtn.dataset.symbol = data.symbol;
        aiBtn.dataset.tf     = data.tf;
    }

    function volFrom(candles) {
        return candles.map(function (c) {
            return {
                time: c.time,
                value: c.volume,
                color: c.close >= c.open ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)',
            };
        });
    }

    // ── Volume-by-price overlay drawing ────────────────────────────
    // SVG-based vertical histogram anchored to the right edge of the
    // chart. Each bucket is a horizontal bar; buy volume (green) and
    // sell volume (red) stacked. POC bucket highlighted brighter.
    // Positioned via LWC priceScale.priceToCoordinate to stay in sync
    // with candle prices during zoom/pan.
    var vpSvg = document.getElementById('chart-vp-overlay');
    function drawVP() {
        if (!vpSvg || !currentVP || currentVP.length === 0) {
            if (vpSvg) vpSvg.innerHTML = '';
            return;
        }
        var rect = container.getBoundingClientRect();
        var svgWidth = 96; // right-side band width in px
        var svgHeight = rect.height;
        vpSvg.setAttribute('width',  svgWidth);
        vpSvg.setAttribute('height', svgHeight);
        vpSvg.style.height = svgHeight + 'px';
        vpSvg.style.width  = svgWidth + 'px';

        // Compute max bucket total to scale bar widths.
        var maxTotal = 0;
        currentVP.forEach(function (b) {
            var t = (b.buy || 0) + (b.sell || 0);
            if (t > maxTotal) maxTotal = t;
        });
        if (maxTotal <= 0) { vpSvg.innerHTML = ''; return; }

        var maxBarW = svgWidth - 6; // leave 6px right-margin against price scale
        var parts = [];
        currentVP.forEach(function (b) {
            // Map bucket midpoint price to Y using LWC's price scale.
            var midPrice = (b.priceLow + b.priceHigh) / 2;
            var y = candleSeries.priceToCoordinate(midPrice);
            if (y == null) return;
            var yLow  = candleSeries.priceToCoordinate(b.priceLow);
            var yHigh = candleSeries.priceToCoordinate(b.priceHigh);
            if (yLow == null || yHigh == null) return;
            var barH = Math.max(1, Math.abs(yLow - yHigh) - 0.5);
            var barY = Math.min(yLow, yHigh);
            var total = (b.buy || 0) + (b.sell || 0);
            var totalW = maxBarW * (total / maxTotal);
            var buyFrac = total > 0 ? (b.buy || 0) / total : 0;
            var buyW  = totalW * buyFrac;
            var sellW = totalW - buyW;
            var xRight = svgWidth - 2;
            // Buy portion (blue, drawn from right edge leftward for the FIRST slice)
            // then sell portion (yellow/orange), stacked leftward.
            var opacity = b.isPOC ? 0.85 : 0.45;
            if (buyW > 0) {
                parts.push('<rect x="' + (xRight - buyW) + '" y="' + barY + '" width="' + buyW + '" height="' + barH + '" fill="#4c6ef5" opacity="' + opacity + '" />');
            }
            if (sellW > 0) {
                parts.push('<rect x="' + (xRight - buyW - sellW) + '" y="' + barY + '" width="' + sellW + '" height="' + barH + '" fill="#f59f00" opacity="' + opacity + '" />');
            }
        });
        vpSvg.innerHTML = parts.join('');
    }

    // Redraw VP whenever the visible range or size changes so the
    // bars stay aligned with the moving price scale.
    chart.timeScale().subscribeVisibleTimeRangeChange(function () { drawVP(); });
    var resizeObs = new ResizeObserver(function () { drawVP(); });
    resizeObs.observe(container);

    function applyChart(data) {
        allCandles = data.candles || [];
        var bb = data.bollinger || {};
        allUpper = bb.upper || [];
        allMid   = bb.mid   || [];
        allLower = bb.lower || [];
        allVol   = volFrom(allCandles);
        candleSeries.setData(allCandles);
        upperSeries.setData(allUpper);
        midSeries.setData(allMid);
        lowerSeries.setData(allLower);
        volSeries.setData(allVol);
        earliestTime = allCandles.length ? allCandles[0].time : null;
        noMoreHistory = false;
        currentVP = data.volumeProfile || null;
        // Volume profile aligns with LWC's price scale — must draw
        // AFTER series data lands (so priceToCoordinate returns
        // real numbers, not null). Defer one tick.
        setTimeout(drawVP, 0);

        clearPlanLines();
        var p = data.plan;
        if (p) {
            addPlanLine(p.entry, '#f59f00', 'entry');
            addPlanLine(p.stop,  '#e03131', 'stop');
            addPlanLine(p.tp1,   '#2f9e44', 'TP1');
            addPlanLine(p.tp2,   '#0ca678', 'TP2');
        }
        chart.timeScale().fitContent();
    }

    // Fetch and prepend an older batch. Called when user pans near the
    // left edge. Deduped by time so repeated calls with same `before`
    // don't double-insert.
    function loadMoreHistory() {
        if (loadingHistory || noMoreHistory || !earliestTime) return;
        loadingHistory = true;
        var url = '/api/chart/data?symbol=' + encodeURIComponent(currentSym())
                + '&tf=' + encodeURIComponent(currentTF())
                + '&limit=1000&before=' + earliestTime;
        fetch(url)
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
                loadingHistory = false;
                if (!res.ok || !res.body.candles || res.body.candles.length === 0) {
                    noMoreHistory = true;
                    return;
                }
                // Prepend older candles that predate earliestTime.
                var newer = res.body.candles.filter(function (c) { return c.time < earliestTime; });
                if (newer.length === 0) { noMoreHistory = true; return; }
                allCandles  = newer.concat(allCandles);
                allVol      = volFrom(newer).concat(allVol);
                var bb = res.body.bollinger || {};
                allUpper = (bb.upper || []).filter(function (b) { return b.time < earliestTime; }).concat(allUpper);
                allMid   = (bb.mid   || []).filter(function (b) { return b.time < earliestTime; }).concat(allMid);
                allLower = (bb.lower || []).filter(function (b) { return b.time < earliestTime; }).concat(allLower);
                candleSeries.setData(allCandles);
                upperSeries.setData(allUpper);
                midSeries.setData(allMid);
                lowerSeries.setData(allLower);
                volSeries.setData(allVol);
                earliestTime = allCandles[0].time;
                // Refresh VP with the wider dataset — backend recomputes
                // from every-candle-it-was-given so the older-batch VP
                // is over just those older bars. Update the overlay to
                // reflect the newly-received distribution.
                currentVP = res.body.volumeProfile || currentVP;
                setTimeout(drawVP, 0);
            })
            .catch(function (e) {
                loadingHistory = false;
                console.warn('history load failed', e);
            });
    }

    // Subscribe to visible-range changes so we know when the user pans
    // close to the left edge (within the leftmost 5 bars of loaded data).
    chart.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
        if (!range || earliestTime == null) return;
        // range.from is the logical bar index of the leftmost visible bar.
        // Negative or near-zero means we're near the left edge of data.
        if (range.from < 5) {
            loadMoreHistory();
        }
    });

    function load() {
        linerEl.textContent = 'Loading ' + currentSym() + ' ' + currentTF() + '…';
        fetch('/api/chart/data?symbol=' + encodeURIComponent(currentSym()) + '&tf=' + encodeURIComponent(currentTF()))
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
                if (!res.ok) {
                    linerEl.textContent = '⚠ ' + (res.body.error || 'load failed');
                    return;
                }
                applyHeader(res.body);
                applyChart(res.body);
            })
            .catch(function (e) {
                linerEl.textContent = '⚠ network: ' + e.message;
            });
    }

    // ── Wiring ─────────────────────────────────────────────────────
    symSel.addEventListener('change', function () {
        history.replaceState({}, '', '/chart?symbol=' + currentSym() + '&tf=' + currentTF());
        aiPane.classList.add('hidden');
        aiPane.dataset.loaded = '';
        load();
    });
    tfPills.forEach(function (p) {
        p.addEventListener('click', function () {
            tfPills.forEach(function (x) { x.classList.remove('active'); });
            p.classList.add('active');
            history.replaceState({}, '', '/chart?symbol=' + currentSym() + '&tf=' + currentTF());
            aiPane.classList.add('hidden');
            aiPane.dataset.loaded = '';
            load();
        });
    });
    if (refreshBtn) refreshBtn.addEventListener('click', load);

    // ── Auto-refresh: poll every 20s for a fresh forming bar ──────
    // Uses a small fetch (limit=30) that returns the tail of the
    // series — enough to update the last few closed bars + the
    // forming bar without redrawing the whole chart.
    var pollTimer = null;
    function pollTick() {
        if (loadingHistory) return; // don't clash with pagination fetch
        fetch('/api/chart/data?symbol=' + encodeURIComponent(currentSym())
              + '&tf=' + encodeURIComponent(currentTF())
              + '&limit=30')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
                if (!data || !data.candles || data.candles.length === 0) return;
                // Update last-known candles by time. LWC series.update()
                // handles either a new bar or a replacement of the
                // latest bar (matched by time key).
                var candles = data.candles;
                candles.forEach(function (c) {
                    candleSeries.update(c);
                    volSeries.update({
                        time: c.time, value: c.volume,
                        color: c.close >= c.open ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)',
                    });
                });
                // Update tail Bollinger too.
                var bb = data.bollinger || {};
                (bb.upper || []).slice(-30).forEach(function (b) { upperSeries.update(b); });
                (bb.mid   || []).slice(-30).forEach(function (b) { midSeries.update(b); });
                (bb.lower || []).slice(-30).forEach(function (b) { lowerSeries.update(b); });
                // Header + summary refresh so score/verdict stay live.
                applyHeader(data);
                // Volume profile — small tail doesn't change overall shape much;
                // skip redraw to avoid flicker. Full VP updates only on symbol/
                // TF switch or manual refresh.
            })
            .catch(function () { /* silent — poll again next tick */ });
    }
    function startPoll() {
        stopPoll();
        pollTimer = setInterval(pollTick, 20000);
    }
    function stopPoll() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    // Pause polling when tab hidden (browsers throttle intervals anyway).
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopPoll(); else startPoll();
    });
    startPoll();

    // AI Analyze — reuses shared aiRender helper (bilingual output).
    aiBtn.addEventListener('click', function () {
        if (!aiPane.classList.contains('hidden')) { aiPane.classList.add('hidden'); return; }
        aiPane.classList.remove('hidden');
        if (aiPane.dataset.loaded === '1') return;
        aiPane.innerHTML = '<em class="ai-loading">Querying Quant advisor for ' + aiBtn.dataset.symbol + ' ' + aiBtn.dataset.tf + '…</em>';
        aiBtn.disabled = true;
        fetch('/ai/analyze/symbol/' + aiBtn.dataset.symbol + '/' + aiBtn.dataset.tf, { method: 'POST' })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
                aiBtn.disabled = false;
                if (!res.ok) {
                    window.aiRender.renderInto(aiPane, { error: res.body.error || 'unknown error' });
                    return;
                }
                window.aiRender.renderInto(aiPane, res.body);
                aiPane.dataset.loaded = '1';
            })
            .catch(function (err) {
                aiBtn.disabled = false;
                window.aiRender.renderInto(aiPane, { error: 'network error: ' + err.message });
            });
    });

    load();
})();
</script>
</body>
</html>
