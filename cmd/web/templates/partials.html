{{define "topnav"}}
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <a class="sidebar-brand" href="/today"><span class="brand-mark">◈</span><span class="brand-text">Hentra</span></a>
    <button type="button" class="sidebar-collapse" id="sidebar-collapse" title="收合側欄" aria-label="collapse sidebar">«</button>
  </div>
  <nav class="topnav" id="topnav">
    <a href="/today" data-i18n="nav.today">Today</a>
    <a href="/" data-i18n="nav.dashboard">Scan</a>
    <div class="nav-group">
      <span class="nav-group-label" data-i18n="nav.g.trade">Trade</span>
      <a href="/chart" data-i18n="nav.chart">Chart</a>
      <a href="/validate" data-i18n="nav.validate">Validate</a>
    </div>
    <div class="nav-group">
      <span class="nav-group-label" data-i18n="nav.g.journal">Journal</span>
      <a href="/journal" data-i18n="nav.portfolio">Portfolio</a>
      <a href="/setups" data-i18n="nav.setups">Setups</a>
      <a href="/tips" data-i18n="nav.tips">Tips</a>
    </div>
    <div class="nav-group">
      <span class="nav-group-label" data-i18n="nav.g.research">Research</span>
      <a href="/calendar" data-i18n="nav.calendar">Calendar</a>
      <a href="/fundamentals" data-i18n="nav.stocks">Stocks</a>
      <a href="/onchain" data-i18n="nav.onchain">On-chain</a>
    </div>
    <div class="nav-group">
      <span class="nav-group-label" data-i18n="nav.g.system">System</span>
      <a href="/ops" data-i18n="nav.ops">Ops</a>
    </div>
  </nav>
  <div class="sidebar-foot" id="sidebar-foot"></div>
</aside>
<header class="topbar-mobile">
  <button type="button" class="nav-burger" id="nav-burger" aria-label="menu" aria-expanded="false">☰</button>
  <a class="brand" href="/today"><span class="brand-mark">◈</span> Hentra</a>
</header>
<div class="sidebar-scrim" id="sidebar-scrim"></div>
<button type="button" class="sidebar-reopen" id="sidebar-reopen" title="展開側欄" aria-label="open sidebar">☰</button>
<script>
  (function () {
    var side = document.getElementById('sidebar'), b = document.getElementById('nav-burger'), scrim = document.getElementById('sidebar-scrim');
    if (!side || !b) return;
    function close() { side.classList.remove('open'); if (scrim) scrim.classList.remove('show'); b.setAttribute('aria-expanded', 'false'); }
    b.addEventListener('click', function () {
      var open = side.classList.toggle('open');
      if (scrim) scrim.classList.toggle('show', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    if (scrim) scrim.addEventListener('click', close);
    side.addEventListener('click', function (e) { if (e.target.tagName === 'A') close(); });

    // Desktop collapse (persisted): hide the rail, show a floating reopen.
    var col = document.getElementById('sidebar-collapse'), reo = document.getElementById('sidebar-reopen'), body = document.body, CK = 'nav-collapsed';
    try { if (localStorage.getItem(CK) === '1') body.classList.add('nav-collapsed'); } catch (e) {}
    function setCol(on) { body.classList.toggle('nav-collapsed', on); try { localStorage.setItem(CK, on ? '1' : '0'); } catch (e) {} }
    if (col) col.addEventListener('click', function () { setCol(true); });
    if (reo) reo.addEventListener('click', function () { setCol(false); });
  })();
</script>
{{end}}
