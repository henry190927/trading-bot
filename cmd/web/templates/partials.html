<header class="topbar-mobile">
  <button type="button" class="nav-burger" id="nav-burger" aria-label="menu" aria-expanded="false">☰</button>
  <a class="brand" href="/today"><span class="brand-mark">◈</span> Hentra</a>
</header>
<div class="sidebar-scrim" id="sidebar-scrim"></div>
<button type="button" class="sidebar-reopen" id="sidebar-reopen" title="展開側欄" aria-label="open sidebar">☰</button>
<script>
  (function () {
    var side = document.getElementById('sidebar'), b = document.getElementById('nav-burger'), scrim = document.getElementById('sidebar-scrim');
    if (!side || !b) return;
    function close() { side.classList.remove('open'); if (scrim) scrim.classList.remove('show'); b.setAttribute('aria-expanded', 'false'); }
    b.addEventListener('click', function () {
      var open = side.classList.toggle('open');
      if (scrim) scrim.classList.toggle('show', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    if (scrim) scrim.addEventListener('click', close);
    side.addEventListener('click', function (e) { if (e.target.tagName === 'A') close(); });

    // Desktop collapse (persisted): hide the rail, show a floating reopen.
    var col = document.getElementById('sidebar-collapse'), reo = document.getElementById('sidebar-reopen'), body = document.body, CK = 'nav-collapsed';
    try { if (localStorage.getItem(CK) === '1') body.classList.add('nav-collapsed'); } catch (e) {}
    function setCol(on) { body.classList.toggle('nav-collapsed', on); try { localStorage.setItem(CK, on ? '1' : '0'); } catch (e) {} }
    if (col) col.addEventListener('click', function () { setCol(true); });
    if (reo) reo.addEventListener('click', function () { setCol(false); });
  })();
</script>

<div class="cmdk-backdrop" id="cmdk-backdrop" hidden>
  <div class="cmdk" role="dialog" aria-label="command palette" aria-modal="true">
    <input class="cmdk-input" id="cmdk-input" type="text" placeholder="跳到… 頁面 / 標的 / 動作 (⌘K)" autocomplete="off" spellcheck="false">
    <ul class="cmdk-list" id="cmdk-list"></ul>
  </div>
</div>
<script>
  (function () {
    var CMDS = [
      {t:'Today', h:'home', u:'/today'}, {t:'Scan', h:'dashboard', u:'/'},
      {t:'Chart', h:'', u:'/chart'}, {t:'Validate', h:'', u:'/validate'},
      {t:'Portfolio', h:'journal', u:'/journal'}, {t:'New journal entry', h:'record', u:'/journal/new'},
      {t:'Setups', h:'forward-log', u:'/setups'}, {t:'Tips', h:'', u:'/tips'},
      {t:'Stocks', h:'US / TW fundamentals', u:'/fundamentals'}, {t:'Calendar', h:'macro', u:'/calendar'},
      {t:'On-chain', h:'', u:'/onchain'}, {t:'Ops', h:'daemons', u:'/ops'},
      {t:'Chart · BTC', h:'symbol', u:'/chart?symbol=BTC'}, {t:'Chart · ETH', h:'symbol', u:'/chart?symbol=ETH'},
      {t:'Chart · XAU', h:'symbol', u:'/chart?symbol=XAU'}, {t:'Chart · XAG', h:'symbol', u:'/chart?symbol=XAG'},
      {t:'Chart · SNDK', h:'symbol', u:'/chart?symbol=SNDK'}, {t:'Chart · NVDA', h:'symbol', u:'/chart?symbol=NVDA'},
      {t:'Toggle theme', h:'slate / industrial', a:'theme'}, {t:'Toggle language', h:'EN / 繁', a:'lang'},
      {t:'Toggle density', h:'cozy / compact', a:'density'}
    ];
    var bd=document.getElementById('cmdk-backdrop'), inp=document.getElementById('cmdk-input'), list=document.getElementById('cmdk-list');
    if(!bd||!inp||!list) return;
    var sel=0, filtered=CMDS;
    function fuzzy(q,s){ q=q.toLowerCase(); s=s.toLowerCase(); var i=0; for(var j=0;j<s.length&&i<q.length;j++){ if(s[j]===q[i]) i++; } return i===q.length; }
    function render(){
      list.innerHTML='';
      filtered.forEach(function(c,i){
        var li=document.createElement('li'); li.className='cmdk-item'+(i===sel?' sel':'');
        li.innerHTML='<span class="cmdk-t">'+c.t+'</span>'+(c.h?'<span class="cmdk-h">'+c.h+'</span>':'');
        li.addEventListener('click',function(){ run(c); });
        list.appendChild(li);
      });
    }
    function refilter(){ var q=inp.value.trim(); filtered=q?CMDS.filter(function(c){return fuzzy(q,c.t+' '+(c.h||''));}):CMDS; sel=0; render(); }
    function open(){ bd.hidden=false; inp.value=''; refilter(); setTimeout(function(){inp.focus();},0); }
    function close(){ bd.hidden=true; }
    function run(c){ close(); if(c.u){ location.href=c.u; } else if(c.a==='theme'){ var b=document.querySelector('.theme-toggle'); if(b)b.click(); } else if(c.a==='lang'){ var b=document.querySelector('.lang-toggle'); if(b)b.click(); } else if(c.a==='density'){ var b=document.querySelector('.density-toggle'); if(b)b.click(); } }
    document.addEventListener('keydown',function(e){
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); bd.hidden?open():close(); return; }
      if(bd.hidden) return;
      if(e.key==='Escape'){ close(); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,filtered.length-1); render(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); render(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(filtered[sel]) run(filtered[sel]); }
    });
    inp.addEventListener('input',refilter);
    bd.addEventListener('click',function(e){ if(e.target===bd) close(); });
  })();
</script>
<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
<script>
  (function () {
    var stack = document.getElementById('toast-stack');
    if (!stack) return;
    var ICO = { ok: '\u2713', err: '\u2715', warn: '\u26A0', info: '\u2139' };
    window.toast = function (msg, kind, ms) {
      kind = kind || 'info';
      var t = document.createElement('div');
      t.className = 'toast ' + kind;
      t.setAttribute('role', kind === 'err' ? 'alert' : 'status');
      var ico = document.createElement('span'); ico.className = 'toast-ico'; ico.textContent = ICO[kind] || ICO.info;
      var body = document.createElement('span'); body.textContent = msg;
      t.appendChild(ico); t.appendChild(body);
      stack.appendChild(t);
      var life = ms || (kind === 'err' ? 6000 : 3500);
      var timer = setTimeout(dismiss, life);
      function dismiss() { clearTimeout(timer); t.classList.add('leaving'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 220); }
      t.addEventListener('click', dismiss);
      return t;
    };
  })();
</script>
<script>
  (function () {
    var KEY = 'tw-density', root = document.documentElement;
    function cur() { return root.getAttribute('data-density') === 'compact' ? 'compact' : 'cozy'; }
    try { if (localStorage.getItem(KEY) === 'compact') root.setAttribute('data-density', 'compact'); } catch (e) {}
    function label(d) { return d === 'compact' ? '\u25A4 Compact' : '\u25A6 Cozy'; }
    function apply(d) {
      if (d === 'compact') root.setAttribute('data-density', 'compact'); else root.removeAttribute('data-density');
      try { localStorage.setItem(KEY, d); } catch (e) {}
    }
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'density-toggle';
      btn.textContent = label(cur()); btn.title = '\u8868\u683C\u758F\u5BC6\u5207\u63DB';
      btn.addEventListener('click', function () { var n = cur() === 'compact' ? 'cozy' : 'compact'; apply(n); btn.textContent = label(n); });
      var bar = document.querySelector('#sidebar-foot') || document.querySelector('header.topbar');
      if (bar) bar.appendChild(btn); else { btn.classList.add('floating'); document.body.appendChild(btn); }
    });
  })();
</script>
{{end}}
