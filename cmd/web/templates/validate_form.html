<!DOCTYPE html>
<html lang="{{.Shell.HTMLLang}}" data-lang="{{.Shell.Lang}}">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("tw-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>{{t "tab.validate"}} · trading-web</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js" defer></script>
</head>
<body>

{{template "topnav" .}}

<main class="ui-page">
<form method="POST" action="/validate" class="ui-form">
  {{if .Error}}<div class="ui-banner bad">{{template "icon" "alert"}}<span>{{t "common.error"}} <code>{{.Error}}</code></span></div>{{end}}

  <section class="ui-card">
    <header class="ui-card-h"><h2>{{t "val.formTitle"}}</h2><span class="ui-sub" style="margin:0">{{t "val.formSub"}}</span></header>
    <div class="ui-f-row">
      <div class="ui-f">
        <label for="symbol">{{t "th.symbol"}}</label>
        <select name="symbol" id="symbol" required>
          <option value="">{{t "f.pick"}}</option>
          {{$cur := .Symbol}}
          {{range .Symbols}}<option value="{{.}}" {{if eq . $cur}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </div>
      <div class="ui-f">
        <span class="ui-f-l">{{t "th.side"}}</span>
        <div class="ui-choice" role="radiogroup">
          <label class="long"><input type="radio" name="side" value="long" {{if eq .Side "long"}}checked{{end}} required>{{t "f.long"}}</label>
          <label class="short"><input type="radio" name="side" value="short" {{if eq .Side "short"}}checked{{end}}>{{t "f.short"}}</label>
        </div>
      </div>
    </div>
    <div class="ui-f-row">
      <div class="ui-f">
        <label for="entry">{{t "f.entryPrice"}}</label>
        <input type="number" step="any" inputmode="decimal" name="entry" id="entry" value="{{.Entry}}" required>
      </div>
      <div class="ui-f">
        <label for="fee_bps">{{t "val.fee"}} <span class="ui-hint">{{t "val.feeHint"}}</span></label>
        <input type="number" step="any" inputmode="decimal" name="fee_bps" id="fee_bps" value="{{.FeeBps}}">
      </div>
    </div>
    <div class="ui-f">
      <span class="ui-f-l">TF</span>
      <div class="ui-choice mono" role="radiogroup" aria-label="timeframe">
        {{$tf := .TF}}
        {{range .TFOptions}}<label><input type="radio" name="tf" value="{{.}}" {{if eq . $tf}}checked{{end}}>{{.}}</label>{{end}}
      </div>
    </div>
  </section>

  <div class="ui-actions">
    <a href="/chart" class="ui-btn ghost">{{t "f.cancel"}}</a>
    <button type="submit" class="ui-btn">{{t "val.submit"}}</button>
  </div>
</form>
</main>
</body>
</html>
