# TEMPLATE ONLY — real values never go in a file that git can see.
#
# Create the real Secret straight from the command line instead:
#
#   kubectl create secret generic trading-secrets \
#     --from-literal=BINGX_API_KEY=... \
#     --from-literal=BINGX_API_SECRET=... \
#     --from-literal=NTFY_TOPIC=...
#
# (On minikube use dummy values: this cluster is for practice, and the
# monitor needs no real key to show how a Secret reaches a container.)
#
# k8s/secret.yaml is in .gitignore in case one is ever written by hand.

apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
type: Opaque
stringData:            # stringData = plain text in, K8s stores it base64-encoded
  BINGX_API_KEY: REPLACE_ME
  BINGX_API_SECRET: REPLACE_ME
  NTFY_TOPIC: REPLACE_ME
